# Deploys sutats into its own namespace with read-only access to workloads.
#
#   kubectl apply -f deploy/sutats.yaml
#
# Then annotate workloads you want on the page (see examples/) and edit the
# sutats-incidents ConfigMap to post incidents or maintenance windows.
apiVersion: v1
kind: Namespace
metadata:
  name: sutats
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sutats
  namespace: sutats
---
# Cluster-wide read access to workloads (for components), namespaces (for
# page discovery via labels) and configmaps (for per-team incidents). If you
# only want to watch certain namespaces, swap this for a Role + RoleBinding in
# each one, set --namespaces, and accept that pages are then disabled.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sutats-reader
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  # Pods for stability and scheduling checks; Services and EndpointSlices
  # for the endpoint check; Ingresses and Routes for the ingress layer.
  - apiGroups: [""]
    resources: ["namespaces", "configmaps", "pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sutats-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sutats-reader
subjects:
  - kind: ServiceAccount
    name: sutats
    namespace: sutats
---
# Incidents and maintenance windows. A ConfigMap with this name in ANY
# namespace is picked up: this one (in the sutats namespace) is for
# cluster-wide announcements, and teams create their own in their namespaces.
# Edit with:
#   kubectl -n sutats edit configmap sutats-incidents
# See examples/incidents.yaml for every supported field.
apiVersion: v1
kind: ConfigMap
metadata:
  name: sutats-incidents
  namespace: sutats
data:
  incidents.yaml: |
    incidents: []
---
# Write access in the sutats namespace only: the history and live-state
# ConfigMaps (sutats-history, sutats-live) and the leader Lease. All replicas
# read them; the elected leader writes them.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sutats-state
  namespace: sutats
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sutats-state
  namespace: sutats
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sutats-state
subjects:
  - kind: ServiceAccount
    name: sutats
    namespace: sutats
---
# Two replicas: one is elected leader and does the sampling, probing and
# writing; the other serves the same pages from the shared ConfigMaps and
# takes over within seconds if the leader goes away. No volume needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sutats
  namespace: sutats
  labels:
    app.kubernetes.io/name: sutats
  # The status page watches itself: replicas, its Service's endpoints, the
  # Ingress or Route in front of it and that host's certificate. Remove
  # these annotations if you would rather it stayed off the page.
  annotations:
    sutats.io/component: "Status page"
    sutats.io/group: "Platform"
    sutats.io/description: "This page"
    sutats.io/order: "1000"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sutats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sutats
    spec:
      serviceAccountName: sutats
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: sutats
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sutats
          image: ghcr.io/danielhouston/sutats:latest # pushed by CI; or `make image push`
          args:
            - --title=Status
            # Default page host and the template for per-page hosts. A
            # namespace labelled sutats.io/page=payments is then served at
            # payments.status.example.com.
            - --host=status.example.com
            - --page-host={slug}.status.example.com
            # - --namespaces=prod,edge
            # - --all-workloads
            # Cluster-wide defaults for the checks. Namespace and workload
            # sutats.io/check.<name> annotations override them.
            # - --check.tls=warn=14d
            # - --check.stability=window=30m
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # History in TimescaleDB (see deploy/timescaledb.yaml). Remove
            # this to fall back to the ConfigMap store.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sutats-db
                  key: url
                  optional: true
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
# Keep one replica serving during node drains and rollouts.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sutats
  namespace: sutats
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sutats
---
apiVersion: v1
kind: Service
metadata:
  name: sutats
  namespace: sutats
spec:
  selector:
    app.kubernetes.io/name: sutats
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Expose it publicly. The default page is on the bare host; every team page
# is a subdomain of it, so one wildcard rule (and a wildcard certificate,
# which needs DNS-01 with cert-manager) covers all of them.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sutats
  namespace: sutats
  annotations:
    # cert-manager.io/cluster-issuer: letsencrypt-dns
spec:
  # ingressClassName: nginx
  rules:
    - host: status.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sutats
                port:
                  name: http
    - host: "*.status.example.com"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sutats
                port:
                  name: http
  # tls:
  #   - hosts: [status.example.com, "*.status.example.com"]
  #     secretName: sutats-tls
